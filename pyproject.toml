[project]
name = "cdek-shopping-mcp"
version = "0.1.0"
description = "MCP server for the cdek.shopping storefront API (catalog, search, products, reviews, recommendations)"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Nikolay Koniukhov", email = "heahoh@gmail.com" }
]
requires-python = ">=3.11"
keywords = ["mcp", "model-context-protocol", "cdek", "cdek-shopping", "ecommerce", "ai-agents"]
classifiers = [
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "mcp[cli]>=2.0.0",
    "httpx>=0.27",
]

[project.urls]
Homepage = "https://github.com/heahoh/cdek-shopping-mcp"
Repository = "https://github.com/heahoh/cdek-shopping-mcp"

[project.scripts]
cdek-shopping-mcp = "cdek_shopping_mcp:main"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"
